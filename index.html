<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>River Indoor</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


<!-- =====================================================
     LOGIN DO CLIENTE
===================================================== -->

<main
    id="loginRadio"
    class="radio">


    <header class="cabecalho">

        <img
            src="img/logo.png"
            alt="River Indoor"
            class="logo">

        <div class="marca">

            <strong>
                RIVER INDOOR
            </strong>

            <span>
                RÁDIO PERSONALIZADA
            </span>

        </div>

    </header>


    <section class="admin-card">

        <div class="login-titulo">

            <span class="login-icone">
                ●
            </span>

            <div>

                <h2>
                    Acesse sua Rádio
                </h2>

                <p>
                    Entre para ouvir sua programação.
                </p>

            </div>

        </div>


        <div class="login-form">


            <label for="emailRadio">
                E-mail
            </label>

            <input
                type="email"
                id="emailRadio"
                placeholder="Digite seu e-mail"
                autocomplete="email">


            <label for="senhaRadio">
                Senha
            </label>

            <input
                type="password"
                id="senhaRadio"
                placeholder="Digite sua senha"
                autocomplete="current-password">


            <button
                id="botaoLoginRadio"
                class="botao-adicionar">

                Entrar na Rádio

            </button>


            <p
                id="mensagemLoginRadio"
                class="mensagem-login">
            </p>


        </div>

    </section>

</main>



<!-- =====================================================
     RÁDIO DO CLIENTE
===================================================== -->

<main
    id="radioCliente"
    class="radio"
    style="display: none;">


    <!-- =================================================
         CABEÇALHO
    ================================================== -->

    <header class="cabecalho">


        <img
            src="img/logo.png"
            alt="River Indoor"
            class="logo">


        <div class="marca">

            <strong>
                RIVER INDOOR
            </strong>

            <span>
                RÁDIO PERSONALIZADA
            </span>

        </div>


        <div class="status-radio">

            <span class="status-ponto"></span>

            AO VIVO

        </div>


    </header>



    <!-- =================================================
         ÁREA DA CAPA / VISUALIZADOR
    ================================================== -->

    <section class="area-capa">


        <div class="visualizador">


            <!-- Logo do cliente -->

            <div class="logo-cliente">

                <img
                    src="img/capa.webp"
                    alt="Logo do cliente"
                    id="capaMusica">

            </div>


            <!-- Círculos animados -->

            <div
                class="ondas"
                id="visualizadorAudio">


                <span class="onda onda-1"></span>

                <span class="onda onda-2"></span>

                <span class="onda onda-3"></span>

                <span class="onda onda-4"></span>


                <div class="nucleo"></div>


            </div>


        </div>


    </section>



    <!-- =================================================
         INFORMAÇÕES
    ================================================== -->

    <section class="informacoes">


        <div class="tocando">

            <span class="tocando-ponto"></span>

            TOCANDO AGORA

        </div>


        <h2 id="nomeClienteRadio">
            Rádio Indoor
        </h2>


        <h1 id="nomeMusica">
            Minha música
        </h1>


        <p id="artista">
            River Tech
        </p>


    </section>



    <!-- =================================================
         PROGRESSO
    ================================================== -->

    <div
        class="progresso"
        id="progresso">

        <div
            class="barra"
            id="barra">
        </div>

    </div>


    <div class="tempo">

        <span id="tempoAtual">
            0:00
        </span>

        <span id="duracao">
            0:00
        </span>

    </div>



    <!-- =================================================
         CONTROLES
    ================================================== -->

    <div class="controles">


        <button
            id="anterior"
            aria-label="Música anterior">

            ⏮

        </button>


        <button
            class="play"
            id="play"
            aria-label="Reproduzir">

            ▶

        </button>


        <button
            id="proxima"
            aria-label="Próxima música">

            ⏭

        </button>


        <button
            id="aleatorio"
            aria-label="Modo aleatório">

            🔀

        </button>


    </div>



    <!-- =================================================
         VOLUME
    ================================================== -->

    <div class="volume">

        <span>
            🔊
        </span>

        <input
            type="range"
            min="0"
            max="100"
            value="80">

    </div>



    <!-- =================================================
         ÁUDIO
    ================================================== -->

    <audio id="audio">
    </audio>



    <!-- =================================================
         PUBLICIDADE
    ================================================== -->

    <section class="publicidade">


        <div class="publicidade-conteudo">


            <span class="publicidade-label">

                PUBLICIDADE

            </span>


            <h2 id="nomePublicidadeRadio">

                Seu anúncio pode aparecer aqui

            </h2>


            <p id="statusPublicidadeRadio">

                Aguardando publicidade

            </p>


        </div>


        <div class="publicidade-icone">

            📢

        </div>


    </section>



    <!-- =================================================
         PLAYLIST
    ================================================== -->

    <section class="playlist-container">


        <div class="playlist-titulo">


            <div>

                <span>
                    SUA RÁDIO
                </span>

                <h2>
                    Playlist
                </h2>

            </div>


            <div class="playlist-status">

                ● ONLINE

            </div>


        </div>


        <div id="listaMusicas">
        </div>


    </section>



    <!-- =================================================
         SAIR
    ================================================== -->

    <button
        id="botaoSairRadio"
        class="botao-adicionar">

        Sair da Rádio

    </button>


</main>



<!-- =====================================================
     SUPABASE
===================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script src="supabase.js"></script>

<script src="script.js"></script>


</body>

</html>
